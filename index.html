
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Feedback App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Feedback Form</h2>

        <form id="feedbackForm">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <textarea
                id="message"
                placeholder="Enter your feedback"
                required
            ></textarea>

            <button type="submit">Submit Feedback</button>

        </form>

        <p id="result"></p>

    </div>


    <script>

        const form = document.getElementById("feedbackForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const message = document.getElementById("message").value;

            const response = await fetch(
                "http://127.0.0.1:8000/feedback",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        message: message
                    })
                }
            );

            const data = await response.json();

            document.getElementById("result").innerText =
                data.message;

            form.reset();

        });

    </script>

</body>
</html>
